name: Gmail sync

# Vercel's Hobby plan hard-caps native cron at once a day (deploy-time rejects
# anything more frequent), so the 5-minute trigger lives here instead — GitHub
# Actions schedules go down to 1-minute granularity for free.
#
# Requires this repo to have a CRON_SECRET repository secret matching the one
# in job-tracker's .env / Vercel env vars (Settings > Secrets and variables >
# Actions). GitHub's schedule is best-effort and can lag a few minutes under
# platform load, but there's no cheaper way to get near-real-time polling.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger job-tracker sync
        run: |
          curl -fsS "https://job-tracker-sage-eta.vercel.app/api/sync?secret=${{ secrets.CRON_SECRET }}"
