# Weekly pull requests for outdated or vulnerable dependencies. The repository is public
# and a merge to main deploys, so every update arrives as a PR to review, never as a push.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps in one PR, so the noise stays low. Majors come one by one.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
